<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Super Tic-Tac-Toe</title>
<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #f5f5f5;
  }

  .main-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 400px;
    margin: auto;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: black;
    gap: 2px;
  }

  .cell {
    width: 40px;
    height: 40px;
    background: white;
    font-size: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }

  .active {
    outline: 3px solid green;
  }

  .won {
    background: lightgray;
  }
</style>
</head>
<body>

<h2>Super Tic-Tac-Toe</h2>
<p id="status">Speler X begint</p>

<div class="main-grid" id="game"></div>

<script>
let currentPlayer = "X";
let boards = [];
let boardWinners = Array(9).fill("");
let currentBoard = null;

// Maak 9 borden
const gameDiv = document.getElementById("game");

for (let b = 0; b < 9; b++) {
  let board = [];
  let boardDiv = document.createElement("div");
  boardDiv.classList.add("board");
  boardDiv.dataset.index = b;

  for (let i = 0; i < 9; i++) {
    let cell = document.createElement("div");
    cell.classList.add("cell");
    cell.dataset.cell = i;
    cell.dataset.board = b;

    cell.onclick = handleClick;

    boardDiv.appendChild(cell);
    board.push("");
  }

  boards.push(board);
  gameDiv.appendChild(boardDiv);
}

function handleClick(e) {
  let b = parseInt(e.target.dataset.board);
  let c = parseInt(e.target.dataset.cell);

  // Check geldig bord
  if (currentBoard !== null && b !== currentBoard) return;
  if (boards[b][c] !== "" || boardWinners[b] !== "") return;

  // Zet plaatsen
  boards[b][c] = currentPlayer;
  e.target.textContent = currentPlayer;

  // Check win klein bord
  if (checkWin(boards[b])) {
    boardWinners[b] = currentPlayer;
    document.querySelectorAll(`.board[data-index='${b}'] .cell`)
      .forEach(cell => cell.classList.add("won"));
  }

  // Check super win
  if (checkWin(boardWinners)) {
    document.getElementById("status").textContent =
      "Speler " + currentPlayer + " wint het spel!";
    return;
  }

  // Bepaal volgend bord
  currentBoard = c;
  if (boardWinners[currentBoard] !== "" || isFull(boards[currentBoard])) {
    currentBoard = null;
  }

  updateActiveBoard();

  // Wissel speler
  currentPlayer = currentPlayer === "X" ? "O" : "X";
  document.getElementById("status").textContent =
    "Speler " + currentPlayer + " is aan zet";
}

function checkWin(board) {
  const wins = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  return wins.some(combo =>
    combo.every(i => board[i] !== "" && board[i] === board[combo[0]])
  );
}

function isFull(board) {
  return board.every(cell => cell !== "");
}

function updateActiveBoard() {
  document.querySelectorAll(".board").forEach(b => {
    b.classList.remove("active");
  });

  if (currentBoard !== null) {
    document.querySelector(`.board[data-index='${currentBoard}']`)
      .classList.add("active");
  }
}
</script>

</body>
</html>
